name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Dependency audit (fails on HIGH-or-worse)
        # Re-run locally: `npm audit --omit=dev --audit-level=high` (prod tree)
        # and `npm audit --audit-level=high` (full tree). Fix with `npm audit fix`.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - name: Style gate (eslint, prettier, markdownlint)
        # Config: eslint.config.mjs, .prettierrc.json, .markdownlint-cli2.jsonc.
        # Re-run locally with `npm run lint`, `npm run format:check`, `npm run lint:md`.
        run: |
          npm run lint
          npm run format:check
          npm run lint:md
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

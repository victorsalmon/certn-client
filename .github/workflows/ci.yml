name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - name: Dependency audit (fails on HIGH-or-worse)
        # Re-run locally: `npm audit --omit=dev --audit-level=high` (prod tree)
        # and `npm audit --audit-level=high` (full tree). Fix with `npm audit fix`.
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Dependency audit gates: fail on HIGH-or-worse vulnerabilities in BOTH trees.
      # Re-run locally with: npm audit --omit=dev --audit-level=high
      #                        npm audit --audit-level=high
      # (after upgrades, re-run both; fix with `npm audit fix` then re-run the audits).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
